services:
  api:
    build:
      context: .
      dockerfile: src/Cookbook.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    networks:
      - homelab

  web:
    build:
      context: ./src/Cookbook.Web
      dockerfile: Dockerfile
    depends_on:
      - api
    networks:
      - homelab

networks:
  homelab:
    external: true