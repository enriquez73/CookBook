name: Build and deploy Raspberry Pi

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cookbook-production
  cancel-in-progress: false

jobs:
  publish-images:
    name: Publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cookbook-api
            dockerfile: docker/Cookbook.Api.Dockerfile
          - image: cookbook-frontend
            dockerfile: docker/Cookbook.Frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/enriquez73/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy on Raspberry Pi
    needs: publish-images
    runs-on: [self-hosted, linux, ARM64, cookbook-prod]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and restart services
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker compose \
            --env-file /home/enrico/docker/cookbook/docker/.env \
            --file docker/docker-compose.raspi.yml \
            pull
          docker compose \
            --env-file /home/enrico/docker/cookbook/docker/.env \
            --file docker/docker-compose.raspi.yml \
            up -d --remove-orphans
